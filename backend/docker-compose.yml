version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-alert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartalert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smart-alert-network

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: smart-alert-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smart-alert-network

  # Application service (uncomment when ready)
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: smart-alert-app
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: postgres
  #     DB_PASSWORD: postgres
  #     DB_NAME: smartalert
  #     DB_SSLMODE: disable
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - smart-alert-network

volumes:
  postgres_data:
    driver: local

networks:
  smart-alert-network:
    driver: bridge
